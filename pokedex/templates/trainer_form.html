{% extends 'base.html' %}

{% block content %}

<h3>{{ title }}</h3>

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit" class="btn btn-success">
        <i class="fa-solid fa-floppy-disk"></i> Guardar
    </button>

    <a href="{% url 'trainer_list' %}" class="btn btn-secondary">Cancelar</a>
</form>

{% endblock %}
