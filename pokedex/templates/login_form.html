{% extends 'base.html' %}

{% block title %}Login | Pokédex{% endblock %}

{% block content %}
<h3>Iniciar sesión</h3>

<form method="POST" class="login-box">
    {% csrf_token %}

    {% if form.errors %}
        <div class="alert alert-danger">
            Usuario o contraseña incorrectos. Intenta nuevamente.
        </div>
    {% endif %}

    {% if next %}
        <input type="hidden" name="next" value="{{ next }}">
    {% endif %}

    <div class="mb-3">
        <label for="id_username" class="form-label">Usuario</label>
        <input type="text" name="username" autofocus autocapitalize="none" autocomplete="username"
               maxlength="150" required id="id_username" class="form-control">
    </div>

    <div class="mb-3">
        <label for="id_password" class="form-label">Contraseña</label>
        <input type="password" name="password" autocomplete="current-password"
               required id="id_password" class="form-control">
    </div>

    <button type="submit" class="btn btn-primary">
        <i class="fa-solid fa-right-to-bracket"></i> Ingresar
    </button>

    <a href="{% url 'index' %}" class="btn btn-secondary">
        Cancelar
    </a>
</form>
{% endblock %}
