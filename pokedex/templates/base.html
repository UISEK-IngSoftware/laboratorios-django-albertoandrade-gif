{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Pokédex{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'pokedex/css/styles.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<div class="container-fluid p-0">

    <div class="banner">
        <img src="{% static 'pokedex/img/pokedex-logo.png' %}" alt="Pokédex" class="logo-pokedex">

        <nav class="menu">
            <a href="{% url 'index' %}">Inicio</a>
            <a href="{% url 'trainer_list' %}">Entrenadores</a>
            <a href="{% url 'pokemon_create' %}">Agregar Pokemon</a>
            <a href="{% url 'trainer_create' %}">Agregar Entrenador</a>

            {% if user.is_authenticated %}
                <span class="user-label">
                    <i class="fa-solid fa-user"></i> {{ user.username }}
                </span>
                <form action="{% url 'logout' %}" method="POST" class="logout-form">
                    {% csrf_token %}
                    <button type="submit" class="logout-link">
                        <i class="fa-solid fa-right-from-bracket"></i> Cerrar sesión
                    </button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">
                    <i class="fa-solid fa-right-to-bracket"></i> Login
                </a>
            {% endif %}
        </nav>
    </div>

    <div class="contenido">
        {% block content %}
        {% endblock %}
    </div>

</div>

</body>
</html>
