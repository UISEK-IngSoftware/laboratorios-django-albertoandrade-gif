{% extends 'base.html' %}

{% block content %}

<h3>Eliminar {{ type }}</h3>

<p>¿Estás seguro de que deseas eliminar <strong>{{ object }}</strong>?</p>

<form method="POST">
    {% csrf_token %}

    <button type="submit" class="btn btn-danger">
        <i class="fa-solid fa-trash"></i> Sí, eliminar
    </button>

    <a href="{% url cancel_url %}" class="btn btn-secondary">
        Cancelar
    </a>
</form>

{% endblock %}
